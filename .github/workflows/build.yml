name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Publishes the self-contained exe and wraps it in the setup wizard. Inno Setup is fetched by
      # the installer helper itself, so the runner needs nothing beyond the SDK.
      - name: Build app and installer
        shell: pwsh
        run: .\build.ps1 -Installer

      - name: Self-test
        shell: pwsh
        run: dotnet run --project tools\SelfTest -c Release
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: driftwall-${{ github.sha }}
          path: |
            dist/Driftwall.exe
            dist/DriftwallSetup-*.exe
          if-no-files-found: error
